[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prestige-core"
version = "0.1.0.dev0"
description = "Shared services for PRESTIGE TECH centers"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Dominik Wasilak"}]

[tool.setuptools.packages.find]
include = ["prestige_core*"]
